requires-python = ">=3.12"
dependencies = [
  "fastapi==0.104.1",
  "pydantic==2.5.0",
  "pydantic-settings==2.1.0",
  "python-dotenv==1.0.0",
  "sqlalchemy==2.0.23",
  "requests==2.31.0",
